stages:
 - build
 - test
 - tag 
    
build_job:
 stage: build
 script:
  - echo "[ProjectName] - Build project..."
  - dotnet build --configuration Release
 only:
  - dev

test_job:
 stage: test
 script:
  - echo "[ProjectName] - Unit testing..."
  - dotnet test --no-build --configuration Release
 dependencies:
  - build_job
 only:
  - dev

tag_job:
  stage: tag
  only:
   - main
  script:
   - echo "[ProjectName] - Tag project..."
   # Get the version number defined in common.props
   - export VERSION=$(sed -n 's/.*<Version>\([0-9]*\.[0-9]*\.[0-9]*\)<\/Version>.*/\1/p' common.props)
   - echo $VERSION
   
   # Replace yougitlab.com with your own gitlab server here
   - git config --global user.email "ci@yougitlab.com"
   - git config --global user.name "GitLab CI Bot"

   - git tag -f $VERSION
   # Replace yougitlab.com here with your own gitlab server. If https is not enabled, change it to http://oauth2:$GITLAB_TOKEN@yougitlab.com/$CI_PROJECT_PATH.git
   # Here $GITLAB_TOKEN needs to configure the GITLAB_TOKEN variable in the gitlab server
   - git remote set-url origin https://oauth2:$GITLAB_TOKEN@yougitlab.com/$CI_PROJECT_PATH.git
   - git push --force origin $VERSION
